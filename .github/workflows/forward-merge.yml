# .github/workflows/forward-merge.yml
# Reusable workflow that opens (or updates) a pull request forward-merging
# a version branch into the next version branch, or into 'main' if there
# is no newer version branch.
#
# Inputs:
#   version-branch-regex (optional): Regex (extended, POSIX ERE) matching
#                                     version branch names, used to find
#                                     all version branches and to
#                                     determine ordering via sort -V.
#                                     Default: '^[0-9]{4}\.[0-9]{2}\.x$'
#   default-target (optional):       Branch to merge into when the
#                                     triggering branch is the newest
#                                     version branch. Default: 'main'
#
# Permissions required from the caller:
#   contents: read
#   pull-requests: write
#
# Usage:
#   name: Forward-Merge
#
#   on:
#     push:
#       branches:
#         - '[0-9][0-9][0-9][0-9].[0-9][0-9].x'
#
#   permissions:
#     contents: read
#     pull-requests: write
#
#   jobs:
#     forward-merge:
#       uses: gbv/reposis_workflows/.github/workflows/forward-merge.yml@v1
#       with:
#         version-branch-regex: '^[0-9]{4}\.[0-9]{2}\.x$'
name: Forward Merge

on:
  workflow_call:
    inputs:
      default-target:
        type: string
        required: false
        default: 'main'
      version-branch-regex:
        type: string
        required: false
        default: '^[0-9]{4}\.[0-9]{2}\.x$'

jobs:
  forward-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine target branch
        id: target
        env:
          SOURCE: ${{ github.ref_name }}
          BRANCH_REGEX: ${{ inputs.version-branch-regex }}
          DEFAULT_TARGET: ${{ inputs.default-target }}
        run: |
          if ! echo "$SOURCE" | grep -qE "$BRANCH_REGEX"; then
            echo "Source branch '$SOURCE' does not match version branch regex '$BRANCH_REGEX'"
            exit 1
          fi

          ALL_VERSIONS=$(git branch -r \
            | sed 's|^[[:space:]]*||' \
            | grep -E "^origin/${BRANCH_REGEX#^}" \
            | sed 's|origin/||' \
            | sort -V)

          NEXT=$(echo "$ALL_VERSIONS" | awk -v cur="$SOURCE" '
            $0 == cur { found=1; next }
            found { print; exit }
          ')

          if [ -z "$NEXT" ]; then
            TARGET="$DEFAULT_TARGET"
          else
            TARGET="$NEXT"
          fi

          echo "Source: $SOURCE -> Target: $TARGET"

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Generate PR body
        id: pr-body
        env:
          SOURCE: ${{ steps.target.outputs.source }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          git fetch --quiet origin "$SOURCE" "$TARGET"

          COMMITS=$(git log \
            --max-count=100 \
            --pretty=format:'* %h %s' \
            "origin/${TARGET}..origin/${SOURCE}")

          if [ -z "$COMMITS" ]; then
            COMMITS="_(no new commits)_"
          fi

          {
            echo 'body<<__PR_BODY_EOF__'
            echo "Merge branch \`${SOURCE}\` into \`${TARGET}\`"
            echo
            echo "## Commits"
            echo
            echo "$COMMITS"
            echo '__PR_BODY_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        env:
          BODY: ${{ steps.pr-body.outputs.body }}
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.target.outputs.source }}
          TARGET: ${{ steps.target.outputs.target }}
          TITLE: "Merge branch '${{ steps.target.outputs.source }}' into ${{ steps.target.outputs.target }}"
        run: |
          EXISTING=$(gh pr list \
            --base "$TARGET" \
            --head "$SOURCE" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #$EXISTING"

            gh pr edit "$EXISTING" \
              --title "$TITLE" \
              --body "$BODY"

            exit 0
          fi

          echo "Creating PR"

          PR_URL=$(gh pr create \
            --base "$TARGET" \
            --head "$SOURCE" \
            --title "$TITLE" \
            --body "$BODY")

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')

          COMMENT=$(printf '%s\n' \
            "To resolve conflicts locally:" \
            '```' \
            "git checkout ${TARGET}" \
            "git pull" \
            "git merge --no-commit --no-ff origin/${SOURCE}" \
            "# Fix conflicts, then:" \
            "git commit" \
            "git push" \
            '```')

          gh pr comment "$PR_NUMBER" --body "$COMMENT"
